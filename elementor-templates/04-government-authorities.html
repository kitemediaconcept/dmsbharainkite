<style>
    /* ==========================================================================
       DMS AUTHORITIES & REGULATORY ENTITIES (5 ICONS - User Spec)
       ========================================================================== */
    .dms-authorities {
      padding: 56px 24px 64px;
      background:
        radial-gradient(
          ellipse at 50% 100%,
          rgba(221, 242, 228, 0.32),
          transparent 65%
        ),
        #fff;
    }

    .dms-authorities__container {
      width: 100%;
      max-width: 1320px;
      margin: 0 auto;
    }

    /* Small, centred heading */
    .dms-authorities__header {
      max-width: 560px;
      margin: 0 auto 36px;
      text-align: center;
    }

    .dms-authorities__tag {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
      padding: 6px 13px;

      border: 1px solid #dcebe1;
      border-radius: 100px;
      background: linear-gradient(135deg, #fff, #edf7f0);

      font-size: 10px;
      font-weight: 600;
      line-height: 16px;
      letter-spacing: 1.4px;
      color: #256344;
    }

    .dms-authorities .dms-authorities__heading {
      margin: 0;
      font-family: Inter, "Inter Placeholder", sans-serif;
      font-size: 16px;
      font-weight: 400;
      line-height: 23px;
      letter-spacing: -0.48px;
      color: #6b6b6b;
      text-align: center;
      text-wrap: balance;
    }

    /* Five large logos */
    .dms-authorities__logos {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      align-items: center;
      gap: 30px;

      margin: 0;
      padding: 12px 0;
      list-style: none;
    }

    .dms-authorities__logo {
      display: flex;
      align-items: center;
      justify-content: center;

      min-width: 0;
      height: 150px;
      padding: 8px;
    }

    .dms-authorities__logo img {
      display: block;
      width: 100%;
      height: auto;
      max-width: 240px;
      max-height: 125px;
      object-fit: contain;
      transition: transform 200ms ease, opacity 200ms ease;
    }

    .dms-authorities__logo:hover img {
      transform: scale(1.03);
    }

    /* Portrait emblem needs a different size */
    .dms-authorities__logo--embassy img {
      width: auto;
      max-width: 100%;
      height: 130px;
      max-height: 130px;
    }

    /* Tablet */
    @media (max-width: 1000px) {
      .dms-authorities {
        padding: 44px 20px 48px;
      }

      .dms-authorities__logos {
        gap: 16px;
      }

      .dms-authorities__logo {
        height: 125px;
        padding: 4px;
      }

      .dms-authorities__logo img {
        max-height: 105px;
      }

      .dms-authorities__logo--embassy img {
        height: 110px;
        max-height: 110px;
      }
    }

    /* Mobile: three logos, then two centred logos */
    @media (max-width: 640px) {
      .dms-authorities {
        padding: 36px 16px 40px;
      }

      .dms-authorities__header {
        margin-bottom: 24px;
      }

      .desktop-break {
        display: none;
      }

      .dms-authorities__logos {
        grid-template-columns: repeat(6, minmax(0, 1fr));
        gap: 16px 12px;
        padding: 0;
      }

      .dms-authorities__logo {
        grid-column: span 2;
        height: 100px;
        padding: 0;
      }

      .dms-authorities__logo:nth-child(4) {
        grid-column: 2 / span 2;
      }

      .dms-authorities__logo:nth-child(5) {
        grid-column: 4 / span 2;
      }

      .dms-authorities__logo img {
        max-height: 88px;
      }

      .dms-authorities__logo--embassy img {
        height: 96px;
        max-height: 96px;
      }
    }
</style>
